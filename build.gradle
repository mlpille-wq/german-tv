plugins {
    id 'com.android.application'
}

def runNumber = System.getenv('GITHUB_RUN_NUMBER')

android {
    namespace 'au.ludger.germantv'
    compileSdk 34

    defaultConfig {
        applicationId 'au.ludger.germantv'
        minSdk 26
        // Kept at 28 (Android 9, the Sony A8G's version) so background behaviour matches the TV.
        targetSdk 28
        versionCode runNumber ? runNumber.toInteger() : 1
        versionName "1.0." + (runNumber ?: '0')
    }

    // A fixed signing key, so each new build installs over the previous one on the TV.
    signingConfigs {
        shared {
            storeFile file('germantv.keystore')
            storePassword 'germantv'
            keyAlias 'germantv'
            keyPassword 'germantv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
