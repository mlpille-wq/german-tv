name: Build German TV app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleRelease --no-daemon

      - name: Rename the app file
        run: cp app/build/outputs/apk/release/app-release.apk GermanTV.apk

      - name: Publish as the "latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: German TV (latest build)
          body: "Install on the TV with the Downloader app: https://github.com/${{ github.repository }}/releases/latest/download/GermanTV.apk"
          files: GermanTV.apk
          make_latest: true
